name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} / ${{ matrix.script }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0
            script: test
          - os: ubuntu-latest
            node: 22.13.0
            script: package
          - os: ubuntu-latest
            node: 24.x
            script: test
          - os: windows-latest
            node: 22.13.0
            script: package

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: npm ci
      - run: npm run ${{ matrix.script }}
