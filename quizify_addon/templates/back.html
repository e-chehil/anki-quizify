<link rel="stylesheet" href="./_quizify.css">

<div class="quizify-stage">
  <article class="container" data-quizify-side="back" dir="auto">
    <header class="quizify-card-header">
      <div class="quizify-deck"><span class="quizify-deck-mark" aria-hidden="true"><svg class="quizify-brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7.5"></circle><path d="m16.3 16.3 4.7 4.7"></path><path d="m7.7 11.2 2.2 2.2 4.5-4.7"></path></svg></span><span>{{Deck}}</span></div>
      <div class="quizify-side-label"><span aria-hidden="true"></span><span data-quizify-i18n="common.answer">Answer</span></div>
    </header>
    <main id="note-container">
      <section id="front" class="quizify-field quizify-side-content quizify-question-context"><!-- quizify-source:start:front -->{{Front}}<!-- quizify-source:end:front --></section>
      <div id="answer" role="separator"><span data-quizify-i18n="common.answer">Answer</span></div>
      <section id="back" class="quizify-field quizify-side-content quizify-answer-content"><!-- quizify-source:start:back -->{{Back}}<!-- quizify-source:end:back --></section>
    </main>
    <footer class="quizify-tags">{{clickable:Tags}}</footer>
  </article>
</div>

<script src="./_quizify-i18n.js"></script>
<script src="./_persistence.js"></script>
<script src="./_quizify.js"></script>
<script>window.Quizify.boot({ side: "back" });</script>
