<link rel="stylesheet" href="./_quizify.css">

<div class="quizify-stage">
  <article class="container" data-quizify-side="front" dir="auto">
    <header class="quizify-card-header">
      <div class="quizify-deck"><span class="quizify-deck-mark" aria-hidden="true">Q</span><span>{{Deck}}</span></div>
      <div class="quizify-side-label"><span aria-hidden="true"></span>Question</div>
    </header>
    <main id="note-container">
      <section id="front" class="quizify-field quizify-side-content"><!-- quizify-source:start:front -->{{Front}}<!-- quizify-source:end:front --></section>
    </main>
    <footer class="quizify-tags">{{clickable:Tags}}</footer>
  </article>
</div>

<script src="./_persistence.js"></script>
<script src="./_quizify.js"></script>
<script>window.Quizify.boot({ side: "front" });</script>
